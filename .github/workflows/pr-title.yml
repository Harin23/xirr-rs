name: PR title

# Separate from pr.yml on purpose:
#   - it must run on `edited`, so fixing a title re-runs the check. Adding
#     `edited` to pr.yml would rebuild all seven targets on every title or
#     description tweak.
#   - it deliberately does NOT run on `synchronize`. Pushing a commit cannot
#     change the title, so there is nothing to recheck.
on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      # The title becomes the squash commit, which is the only thing
      # release-please reads. A title it cannot parse means the change
      # silently never reaches a changelog or a version bump.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            refactor
            test
            build
            ci
            chore
          requireScope: false
