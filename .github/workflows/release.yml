name: Release

# To cut a release: bump the version, merge it, then tag the merge commit.
#
#     npm version 0.3.0
#     git push --follow-tags
#
# npm resolves the right binary for each user through optionalDependencies, so
# there is nothing to download at install time and nothing to verify here.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # napi prepublish creates the GitHub release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: pnpm install

      - name: Create one npm package per platform
        run: pnpm napi create-npm-dirs

      - name: Download the binaries built above
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Put each binary in its platform package
        run: pnpm napi artifacts

      - run: ls -R npm

      - name: Publish
        # Publishing the root package first runs `prepublishOnly`, which is
        # `napi prepublish`: it publishes the seven platform packages, creates
        # the GitHub release, and writes them into optionalDependencies here.
        #
        # A version with a hyphen (0.3.0-rc.1) goes out under `next`, so it
        # cannot become the default install.
        run: |
          npm config set provenance true
          case "$VERSION" in
            *-*) npm publish --access public --tag next ;;
            *)   npm publish --access public ;;
          esac
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
