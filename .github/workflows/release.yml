name: Release

# Every push to main runs release-please. Usually it just opens or updates a
# "chore: release x.y.z" PR and stops there.
#
# Merging that PR makes release-please tag the commit and create the GitHub
# release, which flips release_created to true. Only then do build and publish
# run — and they must run HERE, because a tag pushed with GITHUB_TOKEN never
# starts a workflow of its own.

on:
  push:
    branches: [main]
  # main requires a pull request, so there is otherwise no way to re-run
  # release-please after a failure without inventing a commit. A manual run is
  # safe by construction: build and publish still gate on release_created,
  # which only flips when the release PR itself is merged.
  workflow_dispatch:
    inputs:
      publish_tag:
        description: >-
          Emergency re-publish: build and publish an EXISTING tag, e.g. v0.3.0.
          Leave empty for a normal run, which only refreshes the release PR.
        type: string
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag + release
      pull-requests: write # the release PR
      issues: write # labels on that PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || inputs.publish_tag != ''
    uses: ./.github/workflows/build.yml
    with:
      # refs/tags/ is load-bearing, not cosmetic. actions/checkout resolves a
      # bare name to a BRANCH before a tag, so a stale branch named v0.3.0
      # shadowed the release tag and the entire matrix built the wrong commit
      # while reporting success. Fully qualifying the ref makes that impossible.
      ref: refs/tags/${{ inputs.publish_tag || needs.release-please.outputs.tag_name }}

  publish:
    name: Publish
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true' || inputs.publish_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      TAG: ${{ inputs.publish_tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # See the note on build.ref above: must be refs/tags/, never a bare name.
          ref: refs/tags/${{ inputs.publish_tag || needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check the checkout matches the release
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "release-please tagged $TAG but package.json says $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: pnpm install

      - name: Create one npm package per platform
        run: pnpm napi create-npm-dirs

      - name: Download the binaries built above
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Put each binary in its platform package
        run: pnpm napi artifacts

      - name: Ship the freshly generated bindings
        # index.js hardcodes the version in ~100 places, and the committed copy
        # still says the previous one because release-please only bumps
        # package.json. Publish the copy this release's own build produced.
        run: cp artifacts/generated-js/index.js artifacts/generated-js/index.d.ts .

      - name: Require a binary in every platform package
        # napi skips a missing binary with only a debug log but still lists
        # that platform in optionalDependencies, so users there would install
        # cleanly and get nothing.
        run: |
          missing=0
          for dir in npm/*/; do
            ls "$dir"*.node >/dev/null 2>&1 || { echo "::error::no binary in $dir"; missing=1; }
          done
          exit $missing

      - run: ls -R npm

      - name: Publish
        # `npm publish` runs prepublishOnly, which is `napi prepublish`: it
        # publishes the seven platform packages and writes them into
        # optionalDependencies here. It does NOT create a GitHub release —
        # release-please already did, and there is deliberately no GITHUB_TOKEN
        # in this step, so it could not even if the flag were wrong.
        #
        # A version with a hyphen (0.3.0-rc.1) goes out under `next`.
        run: |
          npm config set provenance true
          case "$VERSION" in
            *-*) npm publish --access public --tag next ;;
            *)   npm publish --access public ;;
          esac
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
