name: Determinism

# The solver's answer must not depend on the machine it ran on. A rate that
# differs between a developer's laptop and a production container is a
# reconciliation incident, not a rounding curiosity.
#
# `exp`, `ln`, `expm1` and `powf` are not bit-specified by IEEE 754 and are
# allowed to differ by an ULP between libm implementations. This job runs the
# core suite - which pins reference rates to a documented relative tolerance,
# and pins bit-stability *within* a platform - on every libm the package ships
# against. See `crates/core/tests/determinism.rs` for what is asserted and why
# the tolerance is relative rather than exact.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            label: linux-glibc
          - host: macos-latest
            label: macos-arm64
          - host: windows-latest
            label: windows-msvc

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch tip

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: determinism-${{ matrix.label }}

      # The whole core suite, not just the determinism file: the parity
      # snapshot and the property test are equally platform-sensitive, and a
      # divergence in either is the same class of problem.
      #
      # The parity snapshot holds bit-exactly only on the platform it was
      # recorded on (linux-glibc); elsewhere it allows a documented ULP budget,
      # for the same libm reason described above. See `PARITY_ULP_BUDGET` in
      # `crates/core/tests/robust_solver.rs`, which carries the per-platform
      # divergence table this job is what keeps honest.
      - name: Core test suite
        run: cargo test -p xirr-core --release

      - name: Determinism assertions
        run: cargo test -p xirr-core --release --test determinism -- --nocapture
