[package]
name = "xirr-core"
# Not published to crates.io. package.json holds the real version.
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Financial functions (XIRR, IRR, NPV, PME) — port of the pyxirr core"

[lib]
doctest = false

[dependencies]
time = { version = "0.3", features = ["parsing", "macros"] }

[dev-dependencies]
assert_approx_eq = "1.1"
rstest = { version = "0.26", default-features = false }
