[workspace]
members = ["crates/core"]

[package]
edition = "2021"
name = "xirr_rs"
version = "0.1.0"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi-derive = "3.0.0"
xirr-core = { path = "crates/core" }
time = { version = "0.3", features = ["parsing", "macros"] }

[dependencies.napi]
version = "3.0.0"
features = ["napi4"]

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
